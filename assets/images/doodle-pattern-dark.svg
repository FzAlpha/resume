<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- WhatsApp-style Developer Doodle Imprint -->
    <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.3">
      <!-- 1. Code brackets -->
      <g transform="translate(30, 30) rotate(-10)">
        <polyline points="6 2 1 7 6 12" />
        <polyline points="14 2 19 7 14 12" />
        <line x1="12" y1="2" x2="8" y2="12" />
      </g>

      <!-- 2. Coffee Cup -->
      <g transform="translate(130, 25) rotate(8)">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
        <line x1="6" y1="2" x2="6" y2="5" />
        <line x1="10" y1="1" x2="10" y2="5" />
        <line x1="14" y1="2" x2="14" y2="5" />
      </g>

      <!-- 3. Terminal Prompt -->
      <g transform="translate(240, 20) rotate(-5)">
        <rect x="0" y="0" width="34" height="24" rx="4" />
        <polyline points="5 8 10 12 5 16" />
        <line x1="13" y1="16" x2="20" y2="16" />
      </g>

      <!-- 4. Planet / Saturn -->
      <g transform="translate(350, 30) rotate(15)">
        <circle cx="12" cy="12" r="8" />
        <path d="M2 15c2-6 18-6 20 0s-18 6-20 0" />
      </g>

      <!-- 5. Padlock -->
      <g transform="translate(450, 25) rotate(-12)">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        <circle cx="12" cy="16" r="1" fill="rgba(255, 255, 255, 0.05)" />
      </g>

      <!-- 6. Cloud -->
      <g transform="translate(20, 110) rotate(6)">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
      </g>

      <!-- 7. Curly Braces -->
      <g transform="translate(105, 115) rotate(-8)">
        <path d="M5 2c-2 0-3 1-3 3v2c0 2-2 3-2 3s2 1 2 3v2c0 2 1 3 3 3" />
        <path d="M15 2c2 0 3 1 3 3v2c0 2 2 3 2 3s-2 1-2 3v2c0 2-1 3-3 3" />
      </g>

      <!-- 8. Git Branch -->
      <g transform="translate(195, 105) rotate(12)">
        <circle cx="6" cy="6" r="3" />
        <circle cx="6" cy="22" r="3" />
        <circle cx="20" cy="10" r="3" />
        <line x1="6" y1="9" x2="6" y2="19" />
        <path d="M6 14a8 8 0 0 1 8-4h3" />
      </g>

      <!-- 9. Microchip / CPU -->
      <g transform="translate(300, 100) rotate(-6)">
        <rect x="6" y="6" width="16" height="16" rx="2" />
        <rect x="10" y="10" width="8" height="8" />
        <line x1="10" y1="2" x2="10" y2="6" />
        <line x1="18" y1="2" x2="18" y2="6" />
        <line x1="10" y1="22" x2="10" y2="26" />
        <line x1="18" y1="22" x2="18" y2="26" />
        <line x1="2" y1="10" x2="6" y2="10" />
        <line x1="2" y1="18" x2="6" y2="18" />
        <line x1="22" y1="10" x2="26" y2="10" />
        <line x1="22" y1="18" x2="26" y2="18" />
      </g>

      <!-- 10. Sparkle / Star -->
      <g transform="translate(410, 110)">
        <path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z" />
      </g>

      <!-- 11. Folder -->
      <g transform="translate(470, 120) rotate(-15)">
        <path d="M2 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5z" />
      </g>

      <!-- 12. Rocket -->
      <g transform="translate(50, 195) rotate(-35)">
        <path d="M12 2c3 4 5 10 3 14l-5-2-2-5c4-2 10 0 14 3z" />
        <path d="M7 14l-4 4 2 2 4-4" />
        <circle cx="11" cy="9" r="1.5" />
      </g>

      <!-- 13. Binary Matrix 0 1 -->
      <g transform="translate(145, 190)">
        <text x="0" y="12" font-family="monospace" font-size="11" fill="rgba(255, 255, 255, 0.035)" stroke="none" font-weight="bold">0 1</text>
        <text x="4" y="24" font-family="monospace" font-size="11" fill="rgba(255, 255, 255, 0.035)" stroke="none" font-weight="bold">1 0</text>
      </g>

      <!-- 14. Gamepad / Controller -->
      <g transform="translate(235, 190) rotate(10)">
        <rect x="2" y="6" width="24" height="14" rx="6" />
        <line x1="6" y1="13" x2="10" y2="13" />
        <line x1="8" y1="11" x2="8" y2="15" />
        <circle cx="18" cy="11.5" r="1" fill="rgba(255, 255, 255, 0.05)" />
        <circle cx="21" cy="14.5" r="1" fill="rgba(255, 255, 255, 0.05)" />
      </g>

      <!-- 15. Database / Cylinder -->
      <g transform="translate(345, 190) rotate(-8)">
        <ellipse cx="12" cy="5" rx="10" ry="3" />
        <path d="M2 5v12c0 1.66 4.48 3 10 3s10-1.34 10-3V5" />
        <path d="M2 11c0 1.66 4.48 3 10 3s10-1.34 10-3" />
      </g>

      <!-- 16. WiFi Signal -->
      <g transform="translate(435, 195) rotate(5)">
        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="2.5" />
      </g>

      <!-- 17. Bug / Debugging -->
      <g transform="translate(25, 290) rotate(15)">
        <rect x="6" y="8" width="12" height="12" rx="6" />
        <path d="M12 8V4" />
        <path d="M8 5l2 3" />
        <path d="M16 5l-2 3" />
        <path d="M3 11h3" />
        <path d="M18 11h3" />
        <path d="M3 17h3" />
        <path d="M18 17h3" />
      </g>

      <!-- 18. Infinity -->
      <g transform="translate(125, 295) rotate(-10)">
        <path d="M8 7c-3.3 0-6 2.2-6 5s2.7 5 6 5c3.5 0 5.5-5 8-5 2.5 0 4.5 5 8 5 3.3 0 6-2.2 6-5s-2.7-5-6-5c-3.5 0-5.5 5-8 5-2.5 0-4.5-5-8-5z" />
      </g>

      <!-- 19. Lightning Bolt -->
      <g transform="translate(225, 280) rotate(8)">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </g>

      <!-- 20. Lambda λ -->
      <g transform="translate(315, 285) rotate(-15)">
        <path d="M4 22l8-18 6 18" />
        <path d="M10 10l-6 12" />
      </g>

      <!-- 21. Keyboard Key [ESC] -->
      <g transform="translate(415, 280) rotate(5)">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <text x="5" y="14" font-family="monospace" font-size="8" fill="rgba(255, 255, 255, 0.035)" stroke="none" font-weight="bold">ESC</text>
      </g>

      <!-- 22. Tree Graph / Nodes -->
      <g transform="translate(40, 380) rotate(-6)">
        <circle cx="12" cy="4" r="3" />
        <circle cx="5" cy="18" r="3" />
        <circle cx="19" cy="18" r="3" />
        <line x1="10" y1="6.5" x2="6.5" y2="15.5" />
        <line x1="14" y1="6.5" x2="17.5" y2="15.5" />
      </g>

      <!-- 23. Floppy Disk -->
      <g transform="translate(140, 375) rotate(12)">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
        <polyline points="17 21 17 13 7 13 7 21" />
        <polyline points="7 3 7 8 15 8" />
      </g>

      <!-- 24. Atom / Electron Orbit -->
      <g transform="translate(245, 375) rotate(-20)">
        <circle cx="12" cy="12" r="2.5" fill="rgba(255, 255, 255, 0.05)" />
        <ellipse cx="12" cy="12" rx="11" ry="4.5" transform="rotate(30 12 12)" />
        <ellipse cx="12" cy="12" rx="11" ry="4.5" transform="rotate(-30 12 12)" />
      </g>

      <!-- 25. Headphones -->
      <g transform="translate(355, 370) rotate(10)">
        <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3v-7z" />
        <path d="M21 14h-3a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3v-7z" />
        <path d="M3 14v-3a9 9 0 0 1 18 0v3" />
      </g>

      <!-- 26. Hexagon Polygon -->
      <g transform="translate(450, 380) rotate(15)">
        <polygon points="12 2 21 7 21 17 12 22 3 17 3 7" />
      </g>

      <!-- 27. Search / Magnifier -->
      <g transform="translate(90, 455) rotate(-15)">
        <circle cx="10" cy="10" r="6" />
        <line x1="14.5" y1="14.5" x2="21" y2="21" />
      </g>

      <!-- 28. Hourglass / Clock -->
      <g transform="translate(200, 450) rotate(8)">
        <path d="M5 22h14" />
        <path d="M5 2h14" />
        <path d="M17 22v-4.17a4 4 0 0 0-1.17-2.83L12 12l-3.83 3a4 4 0 0 0-1.17 2.83V22" />
        <path d="M7 2v4.17a4 4 0 0 0 1.17 2.83L12 12l3.83-3A4 4 0 0 0 17 6.17V2" />
      </g>

      <!-- 29. Function f(x) -->
      <g transform="translate(305, 455) rotate(-5)">
        <text x="0" y="16" font-family="serif" font-style="italic" font-size="14" fill="rgba(255, 255, 255, 0.035)" stroke="none" font-weight="bold">f(x)</text>
      </g>

      <!-- 30. Array [ ] -->
      <g transform="translate(410, 450) rotate(10)">
        <path d="M6 3H2v18h4" />
        <path d="M14 3h4v18h-4" />
        <circle cx="10" cy="12" r="1.5" fill="rgba(255, 255, 255, 0.05)" />
      </g>
    </g>

    <!-- Cyber Blue Accents Scattered (Subtle Highlights) -->
    <g stroke="rgba(59, 130, 246, 0.12)" stroke-width="1.4">
      <polygon points="80,85 83,90 80,95 77,90" />
      <polygon points="275,65 278,70 275,75 272,70" />
      <polygon points="380,150 383,155 380,160 377,155" />
      <polygon points="180,245 183,250 180,255 177,250" />
      <polygon points="475,250 478,255 475,260 472,250" />
      <polygon points="85,340 88,345 85,350 82,345" />
      <polygon points="285,335 288,340 285,345 282,340" />
      <polygon points="380,425 383,430 380,435 377,430" />
      <polygon points="25,440 28,445 25,450 22,445" />
      <polygon points="470,450 473,455 470,460 467,455" />
    </g>
  </svg>